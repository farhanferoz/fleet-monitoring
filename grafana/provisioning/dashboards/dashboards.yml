# Loads every *.json in dashboards/ into a Grafana folder "Fleet".
# Drop another dashboard's JSON file there; it appears within 30 seconds.
apiVersion: 1
providers:
  - name: Fleet
    folder: Fleet
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /dashboards
