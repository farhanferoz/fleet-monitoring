groups:
  - name: fleet-disks
    rules:
      - alert: DiskAlmostFull
        expr: >
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}
                   / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs"}) > 90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mountpoint }} is {{ $value | printf \"%.0f\" }}% full"
      - alert: DiskSmartFailing
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }}: disk {{ $labels.device }} reports a failing SMART status"
      - alert: DiskHot
        expr: smartctl_device_temperature{temperature_type="current"} > 60
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}: disk {{ $labels.device }} at {{ $value }} C for 15 minutes"
